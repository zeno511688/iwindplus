  qiniu:
    - code: "qiniu-main"
      name: "七牛云主配置"
      enabled: true
      priority: 2
      access-key: ${oss-qiniu-main-access-key:}
      secret-key: ${oss-qiniu-main-secret-key:}
      broke: false
  minio:
    - code: "minio-main"
      name: "minio主配置"
      enabled: true
      priority: 3
      endpoint: http://127.0.0.1:9010
      region:
