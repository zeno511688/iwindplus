wechat:
  enabled: true
  mp:
    - code: "wechat-mp-main"
      name: "公众号主配置"
      enabled: true
      priority: 1
      use-redis: false
      app-id: ${wechat-mp-main-app-id}
      secret: ${wechat-mp-main-secret}
      token: ${wechat-mp-main-token}
      aes-key: ${wechat-mp-main-aes-key}
mybatis-plus:
  type-aliases-package: com.iwindplus.**.model,com.iwindplus.**.domain
  executor-type: REUSE
  configuration:
    use-column-label: true
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 打印sql
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
  field:
    fill:
      #  是否开启字段填充
      enabled: true
      # 是否开启插入严格模式
      enabled-insert-strict: true
    crypto:
      # 是否开启
      enabled: true
      # 是否启用输入加密
      enabled-input-encrypt: true
      # 是否启用输入脱敏
      enabled-input-sensitive: false
      # 是否启用输出解密
      enabled-output-decrypt: true
      # 算法
      algorithm: AES
      # 公钥
      public-key: ${mybatis-field-crypto-public-key:}
      # 私钥
      private-key: ${mybatis-field-crypto-private-key:}
      # 密钥
      key: ${mybatis-field-crypto-key:}
springdoc:
  packagesToScan:
    - com.iwindplus.integr.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn