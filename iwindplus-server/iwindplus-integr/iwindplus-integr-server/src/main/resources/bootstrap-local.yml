server:
  # 配置启动的接口
  port: 9006
  servlet:
    application-display-name: 集成服务
cross:
  # 是否开启跨域
  enabled: false
operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadNamePrefix: async
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadNamePrefix: i18n
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadNamePrefix: idempotent-scheduler
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadNamePrefix: http-client
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: ossThreadPool
      threadNamePrefix: oss
      threadPoolAliasName: 对象存储线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: smsThreadPool
      threadNamePrefix: sms
      threadPoolAliasName: 短信线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]

spring:
  # 初始化数据库
  flyway:
    enabled: true
    placeholder-replacement: false
    baseline-on-migrate: true
    locations: classpath:db
    table: flyway_schema_history
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    # 数据库url
    url: jdbc:mysql://127.0.0.1:3317/iwindplus-integr?useUnicode=true&autoReconnect=true&characterEncoding=utf8&rewriteBatchedStatements=true&useConfigs=maxPerformance&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    # 数据库用户名
    username: root
    # 数据库密码
    password: ${mysql-password}
    # Hikari 连接池配置
    hikari:
      # 数据库连接超时时间
      connectionTimeout: 30000
      # 最小空闲连接数量
      minimumIdle: 5
      # 连接池最大连接数，默认是10
      maximumPoolSize: 20
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
seata:
  enabled: true
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: XA
  application-id: ${spring.application.name}
  # 事务分组名称，要和服务端对应
  tx-service-group: iwindplus_tx_group
  service:
    vgroup-mapping:
      # key是事务分组名称 value要和服务端的机房名称保持一致
      iwindplus_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
