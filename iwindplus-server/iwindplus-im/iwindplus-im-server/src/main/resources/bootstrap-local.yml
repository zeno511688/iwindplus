server:
  # 配置启动的接口
  port: 9004
  servlet:
    application-display-name: 即时通讯服务
cross:
  # 是否开启跨域
  enabled: false
im:
  # 是否启用远程token校验
  enabled-remote-token: false
  # 聊天群扫码加入地址
  chatGroupScanUrl: https://www.iwindplus.com/im/joinChatGroup
  mail:
    # 邮件模板编码
    tpl-code: c3f67fd355dd6098156053f68285ba3e
  sms:
    # 短信配置编码
    code: 6856e64cc228215d44c1a351454a8cc5
    # 短信模板编码
    tpl-code: c3f67fd354dd6098154053f68285ba35
  oss:
    # 对象存储模板编码
    tpl-code: c3f67fd355dd6098156053f68385ba35
operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
spring:
  # 初始化数据库
  flyway:
    enabled: true
    placeholder-replacement: false
    baseline-on-migrate: true
    locations: classpath:db
    table: flyway_schema_history
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    # 数据库url
    url: jdbc:mysql://127.0.0.1:3317/iwindplus-im?useUnicode=true&autoReconnect=true&characterEncoding=utf8&rewriteBatchedStatements=true&useConfigs=maxPerformance&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    # 数据库用户名
    username: ${mysql-username}
    # 数据库密码
    password: ${mysql-password}
    # Hikari 连接池配置
    hikari:
      # 数据库连接超时时间
      connectionTimeout: 30000
      # 最小空闲连接数量
      minimumIdle: 5
      # 连接池最大连接数，默认是10
      maximumPoolSize: 20
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
  elasticsearch:
    uris: http://127.0.0.1:9200
    username: ${elasticsearch-username}
    password: ${elasticsearch-password}
    connection-timeout: 5s
    socket-timeout: 30s
websocket:
  server:
    # 是否开启websocket
    enabled: true
    # 是否开启debug
    debug: true
    # 是否使用队列发送消息
    useQueueSend: true
    # 是否使用队列解码消息
    useQueueDecode: true
    # 解码出现异常时，是否打印异常日志
    logWhenDecodeError: true
    # websocket服务名称
    name: ${spring.application.name}-ws
    #  websocket服务端口
    port: 9326
    # 心跳超时时间
    heartbeat-timeout: 0
  ssl:
    # 密钥库存储路径
    keyStore:
    # 信任存储路径
    trustStore:
    # 密钥库密码
    password:
  cluster:
    # 是否开启集群
    enabled: true
    # 发消息到组
    group: true
    # 发消息给指定业务ID
    bs-id: true
    #  发消息给指定用户
    user: true
    # 发送到指定ip
    ip: true
    # 发消息给指定通道
    channel: true
    # 发消息到所有连接
    all: true
seata:
  enabled: true
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: XA
  application-id: ${spring.application.name}
  # 事务分组名称，要和服务端对应
  tx-service-group: iwindplus_tx_group
  service:
    vgroup-mapping:
      # key是事务分组名称 value要和服务端的机房名称保持一致
      iwindplus_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
mybatis-plus:
  type-aliases-package: com.iwindplus.**.model,com.iwindplus.**.domain
  executor-type: REUSE
  configuration:
    use-column-label: true
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 打印sql
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
  field:
    fill:
      #  是否开启字段填充
      enabled: true
      # 是否开启插入严格模式
      enabled-insert-strict: true
    crypto:
      # 是否开启
      enabled: true
      # 是否启用输入加密
      enabled-input-encrypt: true
      # 是否启用输入脱敏
      enabled-input-sensitive: false
      # 是否启用输出解密
      enabled-output-decrypt: true
      # 算法
      algorithm: AES
      # 公钥
      public-key: ${mybatis-field-crypto-public-key:}
      # 私钥
      private-key: ${mybatis-field-crypto-private-key:}
      # 密钥
      key: ${mybatis-field-crypto-key:}
alert:
  # 飞书
  feishu:
    app-id: cli_a92f34e733b81cd1
    app-secret: ${alert-feishu-app-secret}
  log:
    enabled: true
    webhook:
      url: https://open.feishu.cn/open-apis/bot/v2/hook/e479bf95-3d8e-43a3-9d38-7f0db242c9d8
      secret: ${alert-feishu-webhook-secret}
    stack:
      max-length: -1
      max-frames: -1
springdoc:
  packagesToScan:
    - com.iwindplus.im.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn