server:
  # 配置启动的接口
  port: 9008
  servlet:
    application-display-name: binlog生产者
cross:
  # 是否开启跨域
  enabled: false
operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false
swagger:
  server-api:
    # 是否启用API注册
    enabled: true
    # 最大重试次数
    maxRetry: 5
    # 重试间隔时间（单位：秒）
    retryInterval: 3
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: binlogThreadPool
      threadPoolAliasName: binlog线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 0
      platformIds: [ 1 ]
      preStartAllCoreThreads: true
    - threadPoolName: binlogSchedulerThreadPool
      threadPoolAliasName: binlog调度线程池
      executorType: scheduled
      corePoolSize: 5
      maximumPoolSize: 10
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: kafkaListerThreadPool
      threadPoolAliasName: kafka默认集群监听线程池
      executorType: eager
      corePoolSize: 8
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 0
      queueTimeout: 0
      platformIds: [ 1 ]
    - threadPoolName: disruptorThreadPool
      threadPoolAliasName: disruptor线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
kafka:
  multi:
    enabled: true
    # 是否启用动态扩容
    enabled-scale: false
    default-cluster: default
    enabled-dynamic-register: true
    clusters:
      default:
        bootstrap-servers: 127.0.0.1:9092
        # 生产者配置
        producer:
          client-id: default-producer
          retries: 5
          batch-size: 16384
          linger-ms: 10
          buffer-memory: 67108864
          acks: all
          enabled-dempotence: true
          compression-type: lz4
          enable-transaction: false
          transaction-id-prefix: default-tx-
          max-block-ms: 60000
          request-timeout-ms: 30000
          max-request-size: 1048576
          max-in-flight-requests-per-connection: 5
          reconnect-backoff-ms: 1000
          retry-backoff-ms: 500
          enable-reactive: true
          properties:
            max.in.flight.requests.per.connection: 3
        # 消费者配置
        consumer:
          group: default-consumer-group
          client-id: default-consumer
          concurrency: 3
          thread-pool-name: kafkaListerThreadPool
          enable-auto-commit: false
          ack-mode: MANUAL
          auto-commit-interval-ms: 1000
          auto-offset-reset: earliest
          max-poll-records: 500
          max-poll-interval-ms: 600000
          session-timeout-ms: 10000
          heartbeat-interval-ms: 3000
          fetch-min-bytes: 1
          fetch-max-bytes: 524288
          max-partition-fetch-bytes: 1048576
          enabled-batch-listener: true
          ack-count: 1
          ack-time: 10000
          properties:
            fetch.max.wait.ms: 500
          # 是否启用死信主题
          enabled-dlt: true
        # 绑定关系配置
        bindings:
          - topic: iwindplus-binlog-topic
            group: iwindplus-binlog-group
            # 是否自动创建
            auto-create: true
binlog:
  # 是否开启binlog
  enabled: true
  # topic前缀（发送数据）
  topic-prefix: iwindplus-binlog-topic
  data-sources:
    - type: mysql
      server-id: 1
      host: 127.0.0.1
      port: 3317
      username: ${binlog-mysql-username}
      password: ${binlog-mysql-password}
      # 包含的数据库
      database-include-list: iwindplus-mgt
      # 排除的数据库
      database-exclude-list:
      # 包含的表
      table-include-list: iwindplus-mgt.user
      # 排除的的表
      table-exclude-list:
  # binlog 消费位点
  offset:
    topic: ${binlog.topic-prefix}-offset
    replication-factor: -1
    num-partitions: -1
  # 同步表结构变化历史
  history:
    topic: ${binlog.topic-prefix}-schema-history
    replication-factor: -1
    num-partitions: -1
alert:
  # 飞书
  feishu:
    app-id: cli_a92f34e733b81cd1
    app-secret: ${alert-feishu-app-secret}
  log:
    enabled: true
    webhook:
      url: https://open.feishu.cn/open-apis/bot/v2/hook/e479bf95-3d8e-43a3-9d38-7f0db242c9d8
      secret: ${alert-feishu-webhook-secret}
    stack:
      max-length: -1
      max-frames: -1
springdoc:
  packagesToScan:
    - com.iwindplus.binlog.producer.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn