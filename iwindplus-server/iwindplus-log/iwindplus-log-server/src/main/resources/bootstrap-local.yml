server:
  # 配置启动的接口
  port: 9003
  servlet:
    application-display-name: 日志服务
cross:
  # 是否开启跨域
  enabled: false

operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false

dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      platformIds: [ 1 ]
      runTimeout: 5000
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: kafkaListerThreadPool
      threadPoolAliasName: kafka默认集群监听线程池
      executorType: eager
      corePoolSize: 8
      maximumPoolSize: 32
      queueCapacity: 100
      queueTimeout: 0
      runTimeout: 0
      platformIds: [ 1 ]
    - threadPoolName: disruptorThreadPool
      threadPoolAliasName: disruptor线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
spring:
  elasticsearch:
    uris: http://127.0.0.1:9200
    username: ${elasticsearch-username}
    password: ${elasticsearch-password}
    connection-timeout: 5s
    socket-timeout: 30s
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
kafka:
  multi:
    enabled: true
    # 是否启用动态扩容
    enabled-scale: false
    default-cluster: default
    enabled-dynamic-register: true
    clusters:
      default:
        bootstrap-servers: 127.0.0.1:9092
        # 生产者配置
        producer:
          client-id: default-producer
          retries: 5
          batch-size: 16384
          linger-ms: 10
          buffer-memory: 67108864
          acks: all
          enabled-dempotence: true
          compression-type: lz4
          enable-transaction: false
          transaction-id-prefix: default-tx-
          max-block-ms: 60000
          request-timeout-ms: 30000
          max-request-size: 1048576
          max-in-flight-requests-per-connection: 5
          reconnect-backoff-ms: 1000
          retry-backoff-ms: 500
          properties:
            max.in.flight.requests.per.connection: 3
        # 消费者配置
        consumer:
          group: default-consumer-group
          client-id: default-consumer
          concurrency: 3
          thread-pool-name: kafkaListerThreadPool
          enable-auto-commit: false
          ack-mode: MANUAL
          auto-commit-interval-ms: 1000
          auto-offset-reset: earliest
          max-poll-records: 500
          max-poll-interval-ms: 600000
          session-timeout-ms: 10000
          heartbeat-interval-ms: 3000
          fetch-min-bytes: 1
          fetch-max-bytes: 524288
          max-partition-fetch-bytes: 1048576
          enabled-batch-listener: true
          ack-count: 1
          ack-time: 10000
          # 是否异步提交（并发情况）
          enable-async-acks: true
          properties:
            fetch.max.wait.ms: 500
          # 是否启用死信主题
          enabled-dlt: true
          # 消息堆积量最大值（该参数和overloadLagThreshold判断是否需要扩容）
          maxLag: 5
          # 消息堆积量最小值（该参数和idleLagThreshold判断是否需要缩容）
          minLag: 2
          # 连续高lag阈值（该参数和maxLag判断是否需要扩容）
          overloadLagThreshold: 5
          # 连续低lag阈值（该参数和minLag判断是否需要缩容）
          idleLagThreshold: 5
        # 绑定关系配置
        bindings:
          - topic: iwindplus-gatewayLog-topic
            group: iwindplus-gatewayLog-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-loginLog-topic
            group: iwindplus-loginLog-group
            # 是否自动创建
            auto-create: true
disruptor:
  multi:
    # 是否开启
    enabled: true
    configs:
      # 对应kafka group
      iwindplus-gatewayLog-group:
        # 是否启用监控观察
        enabled-observation: true
        # 环形缓冲区大小
        ring-buffer-size: 65536
        # 生产者类型
        producer-type: SINGLE
        # 等待策略
        wait-strategy: YIELDING
        # 等待超时时间
        timeout: 10
        # 阻塞等待超时单位
        time-unit: MILLISECONDS
        # work线程池名称
        thread-pool-name: disruptorThreadPool
        # 恢复比例
        resume-threshold: 0.5
        # 暂停比例
        pause-threshold: 0.1
      iwindplus-loginLog-group:
        # 是否启用监控观察
        enabled-observation: true
        # 环形缓冲区大小
        ring-buffer-size: 65536
        # 生产者类型
        producer-type: SINGLE
        # 等待策略
        wait-strategy: YIELDING
        # 等待超时时间
        timeout: 10
        # 阻塞等待超时单位
        time-unit: MILLISECONDS
        # work线程池名称
        thread-pool-name: disruptorThreadPool
        # 恢复比例
        resume-threshold: 0.5
        # 暂停比例
        pause-threshold: 0.1
