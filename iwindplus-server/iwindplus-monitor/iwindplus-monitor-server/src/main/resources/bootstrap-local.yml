server:
  #配置启动的接口
  port: 9005
  servlet:
    application-display-name: 监控服务
spring:
  security:
    user:
      name: ${login-security-username}
      password: ${login-security-password}
  boot:
    admin:
      ui:
        public-url: http://127.0.0.1:9005
      notify:
        mail:
          from: zengdeguiu88@163.com
          to: 845875725@qq.com
      monitor:
        default-timeout: 30000
      discovery:
        ignored-services:
          - iwindplus-im-ws
  mail:
    port: 465
    host: smtp.163.com
    username: zengdeguiu88@163.com
    password: ${mail-password}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            port: ${spring.mail.port}
            class: javax.net.ssl.SSLSocketFactory