server:
  # 配置启动的接口
  port: 9001
  servlet:
    application-display-name: 管理服务
cross:
  # 是否开启跨域
  enabled: false
filter:
  xss:
    # 是否启用跳过.
    enabled-skip: true
    # 忽略的API
    ignored-api:
      - /i18nProject/save
      - /i18nProject/edit
operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false
swagger:
  server-api:
    # 是否启用API注册
    enabled: true
    # 最大重试次数
    maxRetry: 5
    # 重试间隔时间（单位：秒）
    retryInterval: 3
async-task:
  # 是否开启异步命令
  enabled: true
  # 是否开启成功后删除数据
  enabled-success-delete: true
  # 是否开启异常信息截取
  enabled-exception-capture: true
  # 异常信息截取长度
  exception-capture-length: 4000
  # 是否开启job
  job:
    enabled: true
  web:
    # 接口路径
    path: admin/mgt/asyncTask
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      platformIds: [ 1 ]
      runTimeout: 5000
    - threadPoolName: asyncTaskThreadPool
      threadPoolAliasName: 异步任务线程池
      executorType: eager
      corePoolSize: 8
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: asyncTaskSubThreadPool
      threadPoolAliasName: 异步任务子线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: kafkaListerThreadPool
      threadPoolAliasName: kafka默认集群监听线程池
      executorType: eager
      corePoolSize: 8
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 0
      queueTimeout: 0
      platformIds: [ 1 ]
    - threadPoolName: disruptorThreadPool
      threadPoolAliasName: disruptor线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
spring:
  # 初始化数据库
  flyway:
    enabled: true
    placeholder-replacement: false
    baseline-on-migrate: true
    locations: classpath:db
    table: flyway_schema_history
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    # 数据库url
    url: jdbc:mysql://127.0.0.1:3317/iwindplus-mgt?useUnicode=true&autoReconnect=true&characterEncoding=utf8&rewriteBatchedStatements=true&useConfigs=maxPerformance&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    # 数据库用户名
    username: ${mysql-username}
    # 数据库密码
    password: ${mysql-password}
    # Hikari 连接池配置
    hikari:
      # 数据库连接超时时间
      connectionTimeout: 30000
      # 最小空闲连接数量
      minimumIdle: 5
      # 连接池最大连接数，默认是10
      maximumPoolSize: 20
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
kafka:
  multi:
    enabled: true
    # 是否启用动态扩容
    enabled-scale: false
    default-cluster: default
    enabled-dynamic-register: true
    clusters:
      default:
        bootstrap-servers: 127.0.0.1:9092
        # 生产者配置
        producer:
          client-id: default-producer
          retries: 5
          batch-size: 16384
          linger-ms: 10
          buffer-memory: 67108864
          acks: all
          enabled-dempotence: true
          compression-type: lz4
          enable-transaction: false
          transaction-id-prefix: default-tx-
          max-block-ms: 60000
          request-timeout-ms: 30000
          max-request-size: 1048576
          max-in-flight-requests-per-connection: 5
          reconnect-backoff-ms: 1000
          retry-backoff-ms: 500
          properties:
            max.in.flight.requests.per.connection: 3
        # 消费者配置
        consumer:
          group: default-consumer-group
          client-id: default-consumer
          concurrency: 3
          thread-pool-name: kafkaListerThreadPool
          enable-auto-commit: false
          ack-mode: MANUAL
          auto-commit-interval-ms: 1000
          auto-offset-reset: earliest
          max-poll-records: 500
          max-poll-interval-ms: 600000
          session-timeout-ms: 10000
          heartbeat-interval-ms: 3000
          fetch-min-bytes: 1
          fetch-max-bytes: 524288
          max-partition-fetch-bytes: 1048576
          enabled-batch-listener: true
          ack-count: 1
          ack-time: 10000
          enable-reactive: true
          properties:
            fetch.max.wait.ms: 500
          # 是否启用死信主题
          enabled-dlt: true
        # 绑定关系配置
        bindings:
          - topic: iwindplus-appCert-topic
            group: iwindplus-appCert-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-apiWhiteList-topic
            group: iwindplus-apiWhiteList-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-ipBlackList-topic
            group: iwindplus-ipBlackList-group
            # 是否自动创建
            auto-create: true
rocket:
  multi:
    enabled: true
    default-cluster: default
    clusters:
      default:
        nameServer: 127.0.0.1:9876
        # 生产者配置
        producer:
          send-msg-timeout: 1000
        # 消费者配置
        consumer:
          consume-message-batch-max-size: 10
          # 绑定关系配置
          bindings:
            - topic: iwindplus-server-topic
              group: iwindplus-server-group
              tag: "*"
            - topic: iwindplus-server1-topic
              group: iwindplus-server-group
              tag: "*"
rabbit:
  multi:
    enabled: true
    default-cluster: default
    enabled-dynamic-register: true
    clusters:
      default:
        addresses: 127.0.0.1:5672
        username: ${rabbit-default-username}
        password: ${rabbit-default-password}
        virtual-host: /
        connection-timeout: 5000
        # 生产者配置
        producer:
          #这个配置是保证提供者确保消息推送到交换机中，不管成不成功，都会回调
          publisher-confirm-type: correlated
          #保证交换机能把消息推送到队列中
          publisher-returns: true
        # 消费者配置
        consumer:
          concurrency: 1
          acknowledgeMode: MANUAL
          enabledBatchListener: false
          # 绑定关系配置
          bindings:
            - auto-create: true
              routingKeys:
                - iwindplus.server.demo
              exchange:
                name: iwindplus.server.demo
                type: topic
              queue:
                name: iwindplus.server.demo
                durable: true
                arguments:
                  x-queue-mode: lazy
              group: iwindplus.server.demo
            - auto-create: true
              routingKeys:
                - iwindplus.server.demo.batch
              exchange:
                name: iwindplus.server.demo.batch
                type: topic
              queue:
                name: iwindplus.server.demo.batch
                durable: true
                arguments:
                  x-queue-mode: lazy
              group: iwindplus.server.demo.batch
seata:
  enabled: true
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: XA
  application-id: ${spring.application.name}
  # 事务分组名称，要和服务端对应
  tx-service-group: iwindplus_tx_group
  service:
    vgroup-mapping:
      # key是事务分组名称 value要和服务端的机房名称保持一致
      iwindplus_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
xxl-job:
  enabled: true
  admin:
    addresses: http://127.0.0.1:9880/xxl-job-admin
    access-token: ${xxl-job-access-token}
  executor:
    log-path: logs/job
    log-retention-days: 30
    app-name: ${spring.application.name}
    ip: host.docker.internal
mybatis-plus:
  type-aliases-package: com.iwindplus.**.model,com.iwindplus.**.domain
  executor-type: REUSE
  configuration:
    use-column-label: true
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 打印sql
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
  field:
    fill:
      #  是否开启字段填充
      enabled: true
      # 是否开启插入严格模式
      enabled-insert-strict: true
    crypto:
      # 是否开启
      enabled: true
      # 是否启用输入加密
      enabled-input-encrypt: true
      # 是否启用输入脱敏
      enabled-input-sensitive: false
      # 是否启用输出解密
      enabled-output-decrypt: true
      # 是否启用签名（数据防篡改用）
      enabled-sign: true
      # 密钥（数据防篡改用）
      secret-key: ${mybatis-field-crypto-secret-key}
      # 算法
      algorithm: AES
      # 公钥
      public-key: ${mybatis-field-crypto-public-key:}
      # 私钥
      private-key: ${mybatis-field-crypto-private-key:}
      # 密钥
      key: ${mybatis-field-crypto-key:}
mgt:
  ws:
    # 是否开启ws推送
    enabled: true
  mail:
    # 邮件模板编码
    tpl-code: c3f67fd355dd6098156053f68285ba3e
  sms:
    # 短信模板编码
    tpl-code: c3f67fd354dd6098154053f68285ba35
  oss:
    # 对象存储模板编码
    tpl-code: c3f67fd355dd6098156053f68385ba34
alert:
  # 飞书
  feishu:
    app-id: cli_a92f34e733b81cd1
    app-secret: ${alert-feishu-app-secret:}
  log:
    enabled: true
    webhook:
      url: https://open.feishu.cn/open-apis/bot/v2/hook/e479bf95-3d8e-43a3-9d38-7f0db242c9d8
      secret: ${alert-feishu-webhook-secret:}
    stack:
      max-length: -1
      max-frames: -1
springdoc:
  packagesToScan:
    - com.iwindplus.mgt.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn