server:
  # 配置启动的接口
  port: 9000
  servlet:
    application-display-name: 网关服务
cross:
  # 是否开启跨域
  enabled: true
gateway:
  rate-limiter:
    # 是否开启限流过滤器
    enabled: true
    # 最大缓存数量
    maxSize: 1000
    # 缓存超时时间
    cache-timeout: 10m
    # 缓存刷新时间
    cache-refresh: 15m
    # 限流类型（可选，默认：OVERALL）
    rate-type: OVERALL
    # 限流次数，每个时间窗口允许请求数量（可选，默认：1000）
    rate: 2000
    # 限流速率（可选，默认：1s）
    rate-interval: 1s
  base:
    # 是否开启基础过滤器
    enabled: true
    # 是否启用从cookie中读取token
    enabled-auth-cookie: false
    # 是否启用相对路径
    enabled-relative-path: false
  api-white-list:
    # API白名单过滤器
    enabled: true
    # 最大缓存数量
    maxSize: 1000
    # 缓存超时时间
    cache-timeout: 10m
    # 缓存刷新时间
    cache-refresh: 15m
    # 忽略的API
    ignored-api:
      - /admin/imWs/ws
      - /admin/setup/wechat/getWechatMpQrCode
      - /admin/setup/wechat/getWechatMpQrCodeCallback
      - /admin/setup/wechat/getWechatMaCodeByMobile
      - /admin/setup/wechat/getWechatMaCodeByUserInfo
      - /admin/setup/wechat/getWechatMaQrCode
      - /admin/setup/sms/sendCaptcha
      - /admin/setup/mailbox/sendCaptcha
      - /admin/setup/oss/uploadFile
      - /admin/mgt/thirdBindGrant/editUser
  ip-black-list:
    # 是否开启IP黑名单过滤器
    enabled: true
    # 最大缓存数量
    maxSize: 1000
    # 缓存超时时间
    cache-timeout: 10m
    # 缓存刷新时间
    cache-refresh: 15m
  api-sign:
    # 是否开启API签名过滤器
    enabled: false
    # 最大缓存数量
    maxSize: 1000
    # 缓存超时时间
    cache-timeout: 10m
    # 缓存刷新时间
    cache-refresh: 15m
    # 忽略拦截的API
    ignored-api:
      - /static/**
      - /doc.html
      - /api-docs
      - /inner/**
      - /actuator/**
      - /admin/imWs/ws
      - /oauth2/token
  auth:
    # 是否开启权限过滤器
    enabled: true
    # 是否启用远程token校验
    enabled-remote-token: false
    # 是否开启API权限过滤器
    enabled-api-permission: false
    # token最大缓存数量
    token-maxSize: 1000
    # token缓存超时时间
    token-cache-timeout: 5m
    # token缓存刷新时间
    token-cache-refresh: 10m
    # 权限最大缓存数量
    permission-maxSize: 1000
    # 权限缓存超时时间
    permission-cache-timeout: 10m
    # 权限缓存刷新时间
    permission-cache-refresh: 15m
    # 忽略鉴权的API
    ignored-api:
      - /admin/auth/oauth2/logout
      - /admin/setup/mail/config/listEnabled
      - /admin/setup/mail/tpl/listDisabled
      - /admin/setup/oss/listSignUrl
      - /admin/im/direct/msg/editMsgStatus
    # 通用都有权限的API
    general-api:
      - /admin/mgt/user/getUserInfo
      - /admin/mgt/user/editChangeOrg
      - /admin/mgt/user/getGaQrcode
      - /admin/mgt/user/editGaBindFlag
      - /admin/log/login/log/getLoginInfo
  log:
    # 是否开启日志过滤器
    enabled: true
    # 是否启用记录错误日志
    enabled-error: true
    # 采样率（10：代表10%的采样率）
    sample-rate: 100
    # 是否启用获取请求头
    enabled-request-header: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 请求体限制大小，超过部分丢弃，单位：KB
    limit-request-body: 2
    # 是否启用获取响应头
    enabled-response-header: true
    # 是否启用获取响应体
    enabled-response-body: true
    # 响应体限制大小，超过部分丢弃，单位：KB
    limit-response-body: 2
    # 忽略的API
    ignored-api:
      - /admin/imWs/ws
      - /admin/setup/region/**
      - /admin/log/gateway/log/**
      - /admin/log/login/log/**
      - /admin/log/operation/log/**

dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      platformIds: [ 1 ]
      runTimeout: 5000
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: routeThreadPool
      threadPoolAliasName: 路由线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      threadNamePrefix: routeTask
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: kafkaListerThreadPool
      threadPoolAliasName: kafka默认集群监听线程池
      executorType: eager
      corePoolSize: 8
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 0
      queueTimeout: 0
      platformIds: [ 1 ]
    - threadPoolName: disruptorThreadPool
      threadPoolAliasName: disruptor线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
spring:
  reactor:
    context-propagation: AUTO
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
  cloud:
    gateway:
      httpclient:
        pool:
          type: ELASTIC
          max-connections: 4000
          max-connections-per-route: 500
          acquire-timeout: 45000
          max-idle-time: 60s
          max-life-time: 300s
        # 连接超时时间
        connect-timeout: 10000
        # 响应超时时间
        response-timeout: 10s
        # 请求行最大长度
        max-initial-line-length: 8KB
        # header 最大长度
        max-header-size: 64KB
        ssl:
          handshake-timeout: 5s
          close-notify-flush-timeout: 3s
        compression: true
        wiretap: false
      discovery:
        locator:
          # 是否与服务发现组件进行结合，通过serviceId转发到具体服务实例
          # 是否开启基于服务发现的路由规则
          enabled: true
          # 是否将服务名称转换小写
          lower-case-service-id: true
      metrics:
        enabled: true
    sentinel:
      enabled: false
      namespace: sentinel
      group-id: SENTINEL_GROUP
      data-type: json
      filter:
        enabled: false
      eager: true
      transport:
        dashboard: 127.0.0.1:8880
        # 这个不能重复，不同模块不同的port
        port: 8720
        client-ip: 127.0.0.1
      log:
        dir: ./logs/sentinel
      scg:
        enabled: true
        fallback:
          mode: response
          response-status: 426
          response-body: '{"bizStatus":426, "bizCode": "frequent_requests", "bizMessage":"请求过于频繁，请稍后重试"}'
      datasource:
        # 流量控制
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            namespace: ${spring.cloud.sentinel.namespace}
            data-id: ${spring.application.name}-gateway-flow-rules
            group-id: ${spring.cloud.sentinel.group-id}
            rule-type: gw-flow
            data-type: ${spring.cloud.sentinel.data-type}
            username: ${spring.cloud.nacos.discovery.username}
            password: ${spring.cloud.nacos.discovery.password}
        # API管理规则
        gw-api-group:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            namespace: ${spring.cloud.sentinel.namespace}
            data-id: ${spring.application.name}-gateway-api-group
            group-id: ${spring.cloud.sentinel.group-id}
            rule-type: gw-api-group
            data-type: ${spring.cloud.sentinel.data-type}
            username: ${spring.cloud.nacos.discovery.username}
            password: ${spring.cloud.nacos.discovery.password}
        # 熔断降级
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            namespace: ${spring.cloud.sentinel.namespace}
            data-id: ${spring.application.name}-degrade-rules
            group-id: ${spring.cloud.sentinel.group-id}
            rule-type: degrade
            data-type: ${spring.cloud.sentinel.data-type}
            username: ${spring.cloud.nacos.discovery.username}
            password: ${spring.cloud.nacos.discovery.password}
        # 系统规则
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.discovery.server-addr}
            namespace: ${spring.cloud.sentinel.namespace}
            data-id: ${spring.application.name}-system-rules
            group-id: ${spring.cloud.sentinel.group-id}
            rule-type: system
            data-type: ${spring.cloud.sentinel.data-type}
            username: ${spring.cloud.nacos.discovery.username}
            password: ${spring.cloud.nacos.discovery.password}
kafka:
  multi:
    enabled: true
    # 是否启用动态扩容
    enabled-scale: false
    default-cluster: default
    enabled-dynamic-register: true
    clusters:
      default:
        bootstrap-servers: 127.0.0.1:9092
        # 生产者配置
        producer:
          client-id: default-producer
          retries: 5
          batch-size: 16384
          linger-ms: 10
          buffer-memory: 67108864
          acks: all
          enabled-dempotence: true
          compression-type: lz4
          enable-transaction: false
          transaction-id-prefix: default-tx-
          max-block-ms: 60000
          request-timeout-ms: 30000
          max-request-size: 1048576
          max-in-flight-requests-per-connection: 5
          reconnect-backoff-ms: 1000
          retry-backoff-ms: 500
          properties:
            max.in.flight.requests.per.connection: 3
        # 消费者配置
        consumer:
          group: default-consumer-group
          client-id: default-consumer
          concurrency: 1
          thread-pool-name: kafkaListerThreadPool
          enable-auto-commit: false
          ack-mode: MANUAL
          auto-commit-interval-ms: 1000
          auto-offset-reset: earliest
          max-poll-records: 500
          max-poll-interval-ms: 600000
          session-timeout-ms: 10000
          heartbeat-interval-ms: 3000
          fetch-min-bytes: 1
          fetch-max-bytes: 524288
          max-partition-fetch-bytes: 1048576
          enabled-batch-listener: true
          ack-count: 1
          ack-time: 10000
          properties:
            fetch.max.wait.ms: 500
          # 是否启用死信主题
          enabled-dlt: true
          # 消息堆积量最大值（该参数和maxOverloadCount判断是否需要扩容）
          maxLag: 50000
          # 消息堆积量最小值（通过该参数判断是否需要缩容）
          minLag: 1000
        # 绑定关系配置
        bindings:
          - topic: iwindplus-gatewayLog-topic
            group: iwindplus-gatewayLog-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-appCert-topic
            group: iwindplus-appCert-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-apiWhiteList-topic
            group: iwindplus-apiWhiteList-group
            # 是否自动创建
            auto-create: true
          - topic: iwindplus-ipBlackList-topic
            group: iwindplus-ipBlackList-group
            # 是否自动创建
            auto-create: true
