knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式聚合微服务文档
    strategy: discover
    discover:
      enabled: true
      # 指定版本号(Swagger2|OpenAPI3)
      version : OpenAPI3
      # 需要排除的微服务(eg:网关服务)
      excluded-services:
        - iwindplus-auth
        - iwindplus-im-ws
        - iwindplus-monitor
    basic:
      enable: false
      username: ${knife4j-gateway-username:admin}
      password: ${knife4j-gateway-password:zaq12wsx}