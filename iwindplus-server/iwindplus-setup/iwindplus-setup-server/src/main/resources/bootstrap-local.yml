server:
  # 配置启动的接口
  port: 9006
  servlet:
    application-display-name: 通用设置服务
cross:
  # 是否开启跨域
  enabled: false
operate:
  enabled: true
  log:
    # 是否开启操作日志审计
    enabled: true
    # 是否启用获取请求参数
    enabled-request-param: true
    # 是否启用获取请求体
    enabled-request-body: true
    # 是否启用获取响应体
    enabled-response-body: true
  valid:
    # 是否开启操作配置校验
    enabled: true
    # 是否开启GA校验
    enabled-ga: true
    # 是否开启邮箱校验
    enabled-mail: false
    # 是否开启短信校验
    enabled-sms: false
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: ossThreadPool
      threadPoolAliasName: 对象存储线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: smsThreadPool
      threadPoolAliasName: 短信线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: exportTaskThreadPool
      threadPoolAliasName: 导出任务线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]

spring:
  # 初始化数据库
  flyway:
    enabled: true
    placeholder-replacement: false
    baseline-on-migrate: true
    locations: classpath:db
    table: flyway_schema_history
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    # 数据库url
    url: jdbc:mysql://127.0.0.1:3317/iwindplus-setup?useUnicode=true&autoReconnect=true&characterEncoding=utf8&rewriteBatchedStatements=true&useConfigs=maxPerformance&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    # 数据库用户名
    username: root
    # 数据库密码
    password: ${mysql-password}
    # Hikari 连接池配置
    hikari:
      # 数据库连接超时时间
      connectionTimeout: 30000
      # 最小空闲连接数量
      minimumIdle: 5
      # 连接池最大连接数，默认是10
      maximumPoolSize: 20
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  cache:
    redis:
      time-to-live: 0
  redis:
    # 序列化类型
    serialize-type: PROTOBUF
    idempotent:
      # 是否开启redis幂等（防重复提交）
      enabled: true
    lock:
      # 是否开启redis锁
      enabled: true
    rate-limiter:
      # 是否开启redis限流
      enabled: true
    redisson:
      config: |
        singleServerConfig:
          address: redis://127.0.0.1:6379
          password: ${redis-password}
          database: 6
          connectionMinimumIdleSize: 1
          connectionPoolSize: 2
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 2
seata:
  enabled: true
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: XA
  application-id: ${spring.application.name}
  # 事务分组名称，要和服务端对应
  tx-service-group: iwindplus_tx_group
  service:
    vgroup-mapping:
      # key是事务分组名称 value要和服务端的机房名称保持一致
      iwindplus_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
sms:
  aliyun:
    # 是否开启阿里云短信
    enabled: true
  qiniu:
    # 是否开启七牛云短信
    enabled: true
  lingkai:
    # 是否开启凌凯短信
    enabled: true
  mxtong:
    # 是否开启麦讯通短信
    enabled: true
oss:
  minio:
    # 是否开启minio
    enabled: true
  aliyun:
    # 是否开启阿里云OSS
    enabled: true
  qiniu:
    # 是否开启七牛云OSS
    enabled: true
vod:
  aliyun:
    # 是否开启阿里云VOD
    enabled: true
wechat:
  ma:
    # 是否开启微信小程序
    enabled: true
  mp:
    # 是否开启微信公众号
    enabled: true
ocr:
  print-word:
    # 是否开启打印文字
    enabled: true
    # 应用编码
    app-code: ${ocr-print-word-app-code}
  xiangyun:
    # 是否开启翔云
    enabled: true
    # 访问key
    accessKey:
    # 密钥
    secretKey:
mybatis-plus:
  type-aliases-package: com.iwindplus.**.model,com.iwindplus.**.domain
  executor-type: REUSE
  configuration:
    use-column-label: true
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 打印sql
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
  field:
    fill:
      #  是否开启字段填充
      enabled: true
      # 是否开启插入严格模式
      enabled-insert-strict: true
    crypto:
      # 是否开启
      enabled: true
      # 是否启用输入加密
      enabled-input-encrypt: true
      # 是否启用输入脱敏
      enabled-input-sensitive: false
      # 是否启用输出解密
      enabled-output-decrypt: true
      # 算法
      algorithm: AES
      # 公钥
      public-key: ${mybatis-field-crypto-public-key:}
      # 私钥
      private-key: ${mybatis-field-crypto-private-key:}
      # 密钥
      key: ${mybatis-field-crypto-key:}
alert:
  # 飞书
  feishu:
    app-id: cli_a92f34e733b81cd1
    app-secret: ${alert-feishu-app-secret:}
  log:
    enabled: true
    webhook:
      url: https://open.feishu.cn/open-apis/bot/v2/hook/e479bf95-3d8e-43a3-9d38-7f0db242c9d8
      secret: ${alert-feishu-webhook-secret:}
    stack:
      max-length: -1
      max-frames: -1
springdoc:
  packagesToScan:
    - com.iwindplus.setup.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn