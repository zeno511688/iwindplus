server:
  # 配置启动的接口
  port: 9012
  servlet:
    application-display-name: 分布式事务服务
cross:
  # 是否开启跨域
  enabled: false
dynamictp:
  executors:
    - threadPoolName: asyncThreadPool
      threadPoolAliasName: 异步线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: i18nThreadPool
      threadPoolAliasName: 国际化线程池
      executorType: eager
      corePoolSize: 2
      maximumPoolSize: 4
      queueCapacity: 50
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: idempotentSchedulerThreadPool
      threadPoolAliasName: 幂等调度线程池
      executorType: scheduled
      corePoolSize: 2
      maximumPoolSize: 4
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: httpClientThreadPool
      threadPoolAliasName: http调用客户端线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
    - threadPoolName: tccThreadPool
      threadPoolAliasName: tcc分布式事务线程池
      executorType: eager
      corePoolSize: 16
      maximumPoolSize: 32
      queueCapacity: 100
      runTimeout: 5000
      platformIds: [ 1 ]
spring:
  # 初始化数据库
  flyway:
    enabled: true
    placeholder-replacement: false
    baseline-on-migrate: true
    locations: classpath:db
    table: flyway_schema_history
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    # 数据库url
    url: jdbc:mysql://127.0.0.1:3317/iwindplus-dtx?useUnicode=true&autoReconnect=true&characterEncoding=utf8&rewriteBatchedStatements=true&useConfigs=maxPerformance&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8
    # 数据库用户名
    username: root
    # 数据库密码
    password: ${mysql-password}
    # Hikari 连接池配置
    hikari:
      # 数据库连接超时时间
      connectionTimeout: 30000
      # 最小空闲连接数量
      minimumIdle: 5
      # 连接池最大连接数，默认是10
      maximumPoolSize: 20
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
xxl-job:
  enabled: true
  admin:
    addresses: http://127.0.0.1:9880/xxl-job-admin
    access-token: ${xxl-job-access-token}
  executor:
    log-path: logs/job
    log-retention-days: 30
    app-name: ${spring.application.name}
    ip: host.docker.internal
mybatis-plus:
  type-aliases-package: com.iwindplus.**.model,com.iwindplus.**.domain
  executor-type: REUSE
  configuration:
    use-column-label: true
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 打印sql
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
  field:
    fill:
      #  是否开启字段填充
      enabled: true
      # 是否开启插入严格模式
      enabled-insert-strict: true
    crypto:
      # 是否开启
      enabled: true
      # 是否启用输入加密
      enabled-input-encrypt: true
      # 是否启用输入脱敏
      enabled-input-sensitive: false
      # 是否启用输出解密
      enabled-output-decrypt: true
      # 是否启用签名（数据防篡改用）
      enabled-sign: true
      # 密钥（数据防篡改用）
      secret-key: ${mybatis-field-crypto-secret-key}
      # 算法
      algorithm: AES
      # 公钥
      public-key: ${mybatis-field-crypto-public-key:}
      # 私钥
      private-key: ${mybatis-field-crypto-private-key:}
      # 密钥
      key: ${mybatis-field-crypto-key:}
alert:
  # 飞书
  feishu:
    app-id: cli_a92f34e733b81cd1
    app-secret: ${alert-feishu-app-secret}
  log:
    enabled: true
    webhook:
      url: https://open.feishu.cn/open-apis/bot/v2/hook/e479bf95-3d8e-43a3-9d38-7f0db242c9d8
      secret: ${alert-feishu-webhook-secret}
    stack:
      max-length: -1
      max-frames: -1
springdoc:
  packagesToScan:
    - com.iwindplus.dtx.server.web
knife4j:
  enable: true
  setting:
    language: zh_cn